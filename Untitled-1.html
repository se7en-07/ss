<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uncrumpled Paper Letter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene">
    <!-- Hidden checkbox triggers the unfolding state -->
    <input type="checkbox" id="paper-toggle" />
    <label for="paper-toggle" class="paper-container">
      
      <!-- Crumpled paper texture layers -->
      <div class="paper-ball">
        <div class="crease c1"></div>
        <div class="crease c2"></div>
        <div class="crease c3"></div>
      </div>

      <!-- Main sheet of paper -->
      <div class="paper-sheet">
        <div class="paper-texture"></div>
        <div class="margin-line"></div>
        <div class="letter-content">
          <h2 class="letter-title">Hi, Reya!,</h2>
          <p class="letter-body">
            I know natanggalan bago ko ito gawin, but finally I found the courage to tell you this without getting shy or something. Baka kapag ginawa ko 'to in person magkautal-utal ako HAHAHA, kaya ginawa ko nalang through a letter. Alam kong alam mo na 'to, but I want you to know this directly from me and be honest with you. I've been keeping this to myself for months. At first I thought this was just a simple happy crush, and I've done so many things to get rid of this feeling for you because it feels like hindi siya tama and baka maramdaman mo na ikaw lang ginusto ko dahil ikaw lang ang nandyan, and also I'm terrified to ruin your beautiful soul because I'm still finding my purpose in this life and I'm just starting over again.
          </p>
          <p class="letter-body"> Honestly I feel like I have no direction after nangyari sa buhay ko, that's why pinilit kong burahin this feeling so many times, but I'm wrong.. I can't help myself falling in love, and it still keeps growing. And hindi ko namamalayan I started worrying about you and caring about you, kaya it breaks my heart when the first time I saw you crying, and I didn't know what to do that time, kaya ginawa ko nalang, iniwan ko nalang yung tissue and ano HAHAHA.I think it started with this feeling 4 months ago, and I found myself giggling every time you made a joke and did a funny random thing (you just being you), even when you were just copying what I said. I secretly have feelings in my chest, and I found myself smiling about it. Every time I saw you, I had this feeling na (How could I not fall for this one before?). Your presence gives me motivation to be better because you deserve so much more.</p>

<p class="letter-body">Alam kong nacornyhan kana while reading this, but I don't care anymore HUHUHU. It's not just nagustuhan kita dahil lang sa ganyang bagay. I really like you, even your flaws and imperfections. I love your eyes, I love your hair, and I love your personality. You're like the spring sunshine, you're bright and warm with those eyes, and you're so kind with that smile, and I really love everything about you. And also I want to say thank you for what you've done to me, it may look like small, but sobrang laking bagay sa'kin nun, and I'm so grateful that I feel that kind of care. Hindi man ako kagaling mag-express ng feeling in person when I feel like I've been cared for because kahit papaano ayokong makita ng ibang tao na mahina ako. That's why, thank you! </p>


<p class="letter-body">Don't worry this time I will not turning back my feelings (I hope you too) and I will try my best to prove myself to you, and always remember, no matter what happens, I will always be here for you, I'll be here, to encourage you, to not give up, to keep going and I will always be your biggest fan.❤❤❤</p>
          
<p class="letter-signature">—skibidi</p>
        </div>
      </div>

    </label>
    <p class="instruction">Tap the paper  </p>
  </div>

</body>
</html>
