<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uncrumpled Paper Letter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene">
    <!-- Hidden checkbox triggers the unfolding state -->
    <input type="checkbox" id="paper-toggle" />
    <label for="paper-toggle" class="paper-container">
      
      <!-- Crumpled paper texture layers -->
      <div class="paper-ball">
        <div class="crease c1"></div>
        <div class="crease c2"></div>
        <div class="crease c3"></div>
      </div>

      <!-- Main sheet of paper -->
      <div class="paper-sheet">
        <div class="paper-texture"></div>
        <div class="margin-line"></div>
        <div class="letter-content">
          <h2 class="letter-title">HiReya,</h2>
          <p class="letter-body">
            I know natanggalan bago ko ito gawin pero finally I found a courage to tell you this. It took some effort to find this piece of paper, but I finally have a moment to write down my thoughts...
          </p>
          <p class="letter-signature">—skibidi</p>
        </div>
      </div>

    </label>
    <p class="instruction">Click the paper to unfold or crumple it</p>
  </div>

</body>
</html>
